<!doctype html>
<html lang="id" data-theme="light" data-palette="krem">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Irsyads Toolkit</title>
    <meta name="description" content="Sundanese scripts, dictionaries, Morse, ciphers and converters, with teaching tools by Irsyads." />
    <meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)" />
    <meta name="robots" content="noindex" />
    <meta property="og:title" content="Irsyads Toolkit" />
    <meta property="og:description" content="Script and text tools, converters, calculators and lesson planning." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/service-icons/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Irsyads Toolkit" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&family=Noto+Sans+Arabic:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Migrate only absent shared appearance; preserve legacy settings and account data.
      try {
        var p = JSON.parse(localStorage.getItem('ruang:prefs') || '{}');
        var shared = /irsyads-appearance-(theme|palette)=/.test(document.cookie) || localStorage.getItem('irsyads-theme') || localStorage.getItem('irsyads-palette');
        window.__irsyadsHadAppearance = !!shared;
        var aliases = {krem:'krem',hutan:'forest',samudra:'ocean',senja:'royal',aurora:'aurora',tanah:'earth'};
        if (!shared) {
          if (['system','light','dark'].includes(p.theme) && p.theme !== 'system') localStorage.setItem('irsyads-theme',p.theme);
          if (aliases[p.palette]) localStorage.setItem('irsyads-palette',aliases[p.palette]);
        }
      } catch (e) { window.__irsyadsHadAppearance = /irsyads-appearance-(theme|palette)=/.test(document.cookie); }
    </script>
    <script src="/irsyads-v1/appearance.js"></script><link rel="stylesheet" href="/irsyads-v1/service-navigation.css"><script src="/irsyads-v1/service-navigation.js"></script>
    <script src="/irsyads-v1/language.js"></script><script src="/irsyads-v1/launcher.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Irsyads Toolkit requires JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
