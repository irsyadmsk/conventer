<!doctype html>
<html lang="id" data-theme="light" data-palette="krem">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Ruang · Irsyads</title>
    <meta name="description" content="Ruang kerja keluarga dari irsyads.com: aksara Sunda, kode & sandi, kalkulator lengkap, modul ajar AI, koleksi tersinkron, dan laporan otomatis." />
    <meta name="theme-color" content="#f6f1e8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1024" media="(prefers-color-scheme: dark)" />
    <meta name="robots" content="noindex" />
    <meta property="og:title" content="Ruang · Irsyads" />
    <meta property="og:description" content="Ruang kerja keluarga: alat teks, kalkulator, modul ajar AI, dan laporan cerdas." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/ikon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Ruang" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Volkhov:wght@400;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Terapkan tema sebelum React dimuat agar tidak berkedip.
      try {
        var p = JSON.parse(localStorage.getItem('ruang:prefs') || '{}');
        var t = p.theme || 'system';
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.dataset.palette = p.palette || 'krem';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Ruang membutuhkan JavaScript untuk berjalan.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
